<script>
'use strict';
const embedded=JSON.parse(document.getElementById('collection-data').textContent);
let photos=embedded.photos, records=embedded.records||{}, conflicts=embedded.conflicts||[], current=photos[0]?.id, step=0,typeIndex=0,view='entry',db=null,saveQueue=Promise.resolve(),storageOK=false;
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fractions=['0','¼','⅓','½','1'], unknown=[...fractions,'Unknown'];
const contextFields=[['setting','Setting',['Street','Courtyard','Other']],['orientation','Orientation',['North','East','South','West','Unknown']],['streetRatio','Street width relative to building height',['Narrow','Balanced','Wide','Unknown']],['surroundingGreen','Surrounding greenery',['None','Low','Medium','High']],['ground','Ground floor',['At ground level','Raised ground floor','Front garden','Arcade'],true]];
const typeFields=[['kind','Façade type',['Punched-window façade','Loggia','Semi-loggia','Balcony','Bay window','French balcony','Other']],['share','Share of the entire façade',fractions,false,'Estimate the closest share of the entire façade occupied by this type.'],['relief','Relief',['Flat','Moderately articulated','Strongly articulated']],['material','Structural material',['Masonry','Concrete','Steel','Timber','Other','Unknown']],['thermal','Thermal envelope',['Insulated','Uninsulated','Unknown']],['windows','Window-to-wall ratio',unknown,false,'How much of this type’s wall is made up of windows? ⅓ means roughly one third windows and two thirds solid wall. For a loggia or balcony, assess the wall behind the threshold space.'],['reveal','Window reveal depth',['Flush','Medium','Deep','Not applicable','Unknown']],['threshold','Is there a threshold space?',['Yes','No']]];
const extraFields=[['shade','Solar shading',['None','Awning','External shading','Other','Unknown'],true],['green','Building greenery',['None','Planters','Façade greening','Other'],true]];
function thresholdValue(t){return t.kind==='Punched-window façade'?'No':t.kind?'Yes':undefined;}
function questionsForType(t){return typeFields.filter(d=>d[0]!=='threshold');}
function blank(){return {location:{},context:{},division:{},types:[{}],notes:'',completed:false,updatedAt:null};}
function locationFor(p){return {...(p.location||{}),...(records[p.id]?.location||{})};}
function rec(){const r=records[current]||(records[current]=blank());const p=photos.find(p=>p.id===current);for(const k of ['lat','lng'])if(r.location[k]===undefined&&p?.location?.[k]!==undefined)r.location[k]=String(p.location[k]);return r;}
function imageOf(p){return p.src;}
function report(message,error=false){$('#saveState').textContent=message;$('#saveState').style.color=error?'#002FA7':'';}
function persist(){const payload=JSON.stringify({records,conflicts,saveMeta,analysisSettings,uploadedPhotos:photos.filter(p=>p.uploaded)});report('Saving…');saveQueue=saveQueue.catch(()=>{}).then(()=>new Promise((resolve,reject)=>{if(!db){reject(new Error('Storage unavailable'));return;}const tx=db.transaction('state','readwrite');tx.objectStore('state').put(payload,embedded.dataset);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);})).then(()=>{storageOK=true;report('✓ Saved in this browser');}).catch(()=>{storageOK=false;report('Save failed — export a copy',true);});return saveQueue;}
function changed(){const r=rec();r.updatedAt=new Date().toISOString();r.completed=false;persist();renderList();}
function renderList(){const term=$('#search').value.toLowerCase(),filter=$('#statusFilter').value;$('#total').textContent=photos.length+' photos';$('#photoList').innerHTML=photos.filter(p=>p.name.toLowerCase().includes(term)&&(filter==='all'||(filter==='done')===!!records[p.id]?.completed)).map(p=>`<button class="photo-item ${p.id===current?'active':''}" data-photo="${esc(p.id)}"><img src="${esc(imageOf(p))}" alt="" loading="lazy"><span>${esc(p.name)}<small>${records[p.id]?.completed?'Completed':records[p.id]?.updatedAt?'In progress':'Not started'}</small></span><i class="status-dot ${records[p.id]?.completed?'done':''}"></i></button>`).join('')||'<div class="empty">No matching photographs.</div>';}
function field(def,obj,scope){const [key,label,options,multi,hint]=def;return `<fieldset class="field"><legend>${esc(label)}${multi?' <span class="muted">· select all that apply</span>':''}</legend>${hint?`<p class="hint">${esc(hint)}</p>`:''}<div class="options">${options.map((v,i)=>`<label class="option"><input type="${multi?'checkbox':'radio'}" name="${scope}-${key}" data-scope="${scope}" data-key="${key}" value="${esc(v)}" ${multi?(obj[key]||[]).includes(v)?'checked':'':obj[key]===v?'checked':''}><span>${esc(v)}</span></label>`).join('')}</div></fieldset>`;}
function textField(key,label,value,attrs=''){return `<div class="field"><label for="${key}">${label}</label><input class="full" id="${key}" data-location="${key}" value="${esc(value)}" ${attrs}></div>`;}
function render(){disposeLocationMap();renderList();if(view==='insights'){renderInsights();return;}if(!photos.length){$('#main').innerHTML='<h1>No photographs found</h1><p>Run the collection preparation script to include the photographs from the images folder.</p>';return;}const p=photos.find(p=>p.id===current),r=rec();const labels=['Location','Urban context','Divide façade','Describe types','Review'];$('#main').innerHTML=`<div class="intro"><div><div class="eyebrow">Façade survey / ${String(photos.indexOf(p)+1).padStart(2,'0')} of ${photos.length}</div><h1>Identify the façade.</h1><div class="muted">Observe, classify, compare.</div></div><button id="insights">View analysis ↗</button></div><nav class="steps" aria-label="Survey stages">${labels.map((l,i)=>`<button class="step ${step===i?'active':''}" data-step="${i}">${String(i+1).padStart(2,'0')} &nbsp; ${l}</button>`).join('')}</nav><div class="workbench"><section class="photo-panel"><div class="photo-frame"><img src="${esc(imageOf(p))}" alt="Façade photograph ${esc(p.name)}" id="mainPhoto"></div><div class="photo-caption"><span>${esc(p.name)}</span><a href="${esc(imageOf(p))}" target="_blank" rel="noopener">Open full image ↗</a></div><div class="notice">${r.completed?'✓ This façade is complete. Editing an answer reopens it.':'Your observations save automatically in this browser.'}</div>${conflicts.length?`<button id="conflictButton" class="full">Review ${conflicts.length} merge conflict(s)</button>`:''}</section><section class="form-panel"><span class="section-number">${String(step+1).padStart(2,'0')} / ${labels[step]}</span>${formContent(r)}<div id="validation" class="error" role="alert"></div><div class="form-footer"><button id="back" ${step===0?'disabled':''}>← Back</button><button class="primary" id="next">${step===4?'Complete & next photo →':step===3&&typeIndex<r.types.length-1?'Next façade type →':'Continue →'}</button></div></section></div><footer class="app-footer">FACADE ID &nbsp; / &nbsp; Offline collection · No account required · Save a copy before sharing</footer>`;if(step===0)mountLocationPicker();}
function formContent(r){if(step===0)return `<h2>Where was the photo taken?</h2>${mapPickerMarkup()}<div class="grid2">${textField('lat','Latitude',r.location.lat,'type="number" min="-90" max="90" step="any" placeholder="e.g. 52.5200"')}${textField('lng','Longitude',r.location.lng,'type="number" min="-180" max="180" step="any" placeholder="e.g. 13.4050"')}</div>`;
if(step===1)return '<h2>Read the urban context.</h2><p class="hint">Describe the space around the building.</p>'+contextFields.map(d=>field(d,r.context,'context')).join('');
if(step===2)return `<h2>One façade, or several types?</h2><p class="hint">Homogeneous: predominantly one type.<br>Heterogeneous: several distinguishable types.</p>${field(['homogeneity','Façade composition',['Homogeneous','Heterogeneous']],r.division,'division')}${r.division.homogeneity==='Heterogeneous'?`<div class="field"><label for="typeCount">How many façade types?</label><input id="typeCount" type="number" min="2" max="30" step="1" value="${r.types.length}"><p class="hint">Each type will be described separately. Reducing the count keeps previous answers available if you increase it again.</p></div>`:''}`;
if(step===3){const t=r.types[typeIndex]||{};return `<h2>Describe type ${typeIndex+1}.</h2><div class="type-tabs">${r.types.map((t,i)=>`<button class="${i===typeIndex?'active':''}" data-type="${i}">Type ${i+1}</button>`).join('')}</div>${questionsForType(t).map(d=>field(d,t,'type')).join('')}${thresholdValue(t)==='Yes'?`${field(['depth','Threshold depth',['Under 1 m','1 m or more','Not applicable','Unknown']],t,'type')}${field(['enclosure','Threshold enclosure',['Low','Medium','High','Unknown'],false,'Low = mostly open · Medium = partly enclosed · High = mostly enclosed.'],t,'type')}`:''}${extraFields.map(d=>field(d,t,'type')).join('')}`;}
return `<h2>Your façade profile.</h2><p class="hint">Check your observations before completing this photograph.</p>${summaryRows(r.context,contextFields)}<div class="review-row"><b>Composition</b><span>${esc(r.division.homogeneity||'Not answered')}</span></div>${r.types.map((t,i)=>`<h3>Type ${i+1}</h3>${summaryRows(t,[...questionsForType(t),...(thresholdValue(t)==='Yes'?[['depth','Threshold depth'],['enclosure','Threshold enclosure']]:[]),...extraFields])}`).join('')}<div class="field"><label for="notes">Additional observations (optional)</label><textarea id="notes" class="full" rows="3" data-record="notes">${esc(r.notes)}</textarea></div>`;
}
function summaryRows(obj,defs){return defs.map(([k,l])=>`<div class="review-row"><b>${esc(l)}</b><span>${esc(Array.isArray(obj[k])?obj[k].join(', '):obj[k]||'Not answered')}</span></div>`).join('');}
function missing(r,stage=4,idx=null){const m=[];if(stage===0||stage===4){for(const [k,min,max]of [['lat',-90,90],['lng',-180,180]]){const v=r.location[k];if(v!==undefined&&v!==''&&(!Number.isFinite(Number(v))||Number(v)<min||Number(v)>max))m.push('Valid '+(k==='lat'?'latitude':'longitude'));}if((r.location.lat!==undefined&&r.location.lat!=='')!==(r.location.lng!==undefined&&r.location.lng!==''))m.push('Both coordinates or neither');}if(stage===1||stage===4)contextFields.forEach(([k,l])=>{if(!r.context[k]?.length)m.push(l);});if(stage===2||stage===4)if(!r.division.homogeneity)m.push('Façade composition');if(stage===3||stage===4)r.types.forEach((t,i)=>{if(idx!==null&&i!==idx)return;const defs=[...questionsForType(t),...extraFields];if(thresholdValue(t)==='Yes'){defs.push(['depth','Threshold depth']);defs.push(['enclosure','Threshold enclosure']);}defs.forEach(([k,l])=>{if(!t[k]?.length)m.push(`Type ${i+1}: ${l}`);});});return m;}
function download(content,name,mime){const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function payload(){return {version:1,saveMeta:{...saveMeta},analysisSettings:{...analysisSettings},dataset:embedded.dataset,records,conflicts,exportedAt:new Date().toISOString()};}
async function saveHtml(initials){if(!initials){openSaveDialog();return;}if(!/^[A-Z0-9]{1,12}$/.test(initials))throw new Error('Invalid initials');const nextMeta={revision:saveMeta.revision+1,initials,savedAt:new Date().toISOString()};const b=$('#saveHtml');b.disabled=true;b.textContent='Preparing HTML…';try{await saveQueue;const packed=[];for(const p of photos){let src=p.src;if(!src.startsWith('data:')){const response=await fetch(src);if(!response.ok)throw new Error('Could not read '+p.name);src=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL;response.blob().then(blob=>reader.readAsDataURL(blob),reject);});}packed.push({...p,src});}const clone=document.documentElement.cloneNode(true);clone.querySelector('#collection-data').textContent=JSON.stringify({...payload(),saveMeta:nextMeta,photos:packed}).replace(/</g,'\\u003c');clone.querySelector('#main').innerHTML='';clone.querySelector('#photoList').innerHTML='';clone.querySelector('#mergeDialog').innerHTML='';clone.querySelector('#mergeDialog').removeAttribute('open');clone.querySelector('#saveHtml').disabled=false;clone.querySelector('#saveHtml').textContent='Save';clone.querySelector('#revisionLabel').textContent=revisionLabel(nextMeta.revision)+' · '+initials;clone.querySelector('#saveDialog').removeAttribute('open');clone.querySelector('#saveInitials').value='';download('<!doctype html>\n'+clone.outerHTML,saveFilename(initials,nextMeta.revision),'text/html');saveMeta=nextMeta;updateRevisionLabel();await persist();report('Copy downloaded');}catch(e){report('HTML save failed',true);alert('Could not embed the photos. Open the standalone Facade-ID.html file instead. '+e.message);}finally{b.disabled=false;b.textContent='Save';}}
function canonical(r){const copy=structuredClone(r);delete copy.updatedAt;return JSON.stringify(copy);}
function mergeData(data){if(data.dataset!==embedded.dataset||data.version!==1||!data.records||typeof data.records!=='object')throw new Error('This file does not belong to this collection.');mergeUploadedPhotos(data.photos||[]);let added=0,same=0,clash=0;for(const [id,incoming]of Object.entries(data.records)){if(!photos.some(p=>p.id===id))continue;if(!incoming||!incoming.location||!incoming.context||!incoming.division||!Array.isArray(incoming.types)||!incoming.types.length||incoming.types.length>30)throw new Error('Invalid façade record: '+id);const local=records[id];if(!local?.updatedAt){records[id]=incoming;added++;}else if(canonical(local)===canonical(incoming)){same++;}else if(incoming.updatedAt){if(!conflicts.some(c=>c.id===id&&canonical(c.incoming)===canonical(incoming))){conflicts.push({id,incoming});clash++;}}}return {added,same,clash};}
function showConflicts(){const dialog=$('#mergeDialog');if(!conflicts.length){dialog.innerHTML='<h2>No conflicts remaining.</h2><button data-close>Close</button>';}else{const c=conflicts[0],p=photos.find(p=>p.id===c.id);dialog.innerHTML=`<div class="eyebrow">${conflicts.length} conflict(s) remaining</div><h2>${esc(p?.name||c.id)}</h2><p>Both copies have answers. Choose which complete profile to keep for this photograph.</p><div class="grid2"><div><b>Current profile</b><pre>${esc(JSON.stringify(records[c.id],null,2))}</pre></div><div><b>Incoming profile</b><pre>${esc(JSON.stringify(c.incoming,null,2))}</pre></div></div><div class="form-footer"><button data-resolve="local">Keep current</button><button data-resolve="incoming" class="primary">Use incoming</button><button data-close>Decide later</button></div>`;}if(!dialog.open)dialog.showModal();}
const numeric=v=>({'0':0,'¼':.25,'⅓':1/3,'½':.5,'1':1,'Flat':0,'Moderately articulated':.5,'Strongly articulated':1,'None':0,'Low':1/3,'Medium':2/3,'High':1,'Narrow':0,'Balanced':.5,'Wide':1}[v]);
function renderInsights(){const list=photos.filter(p=>records[p.id]?.updatedAt),done=list.filter(p=>records[p.id].completed),active=photos.find(p=>p.id===current),types=list.flatMap(p=>records[p.id].types.map(t=>({...t,photo:p})));const kinds=typeFields[0][2];const matrix=kinds.map(k=>{const ts=types.filter(t=>t.kind===k);return `<tr><th>${k}</th>${extraFields[1][2].map(g=>{const n=ts.filter(t=>t.green?.includes(g)).length;return `<td class="${n?'tint':''}">${n||'—'}</td>`;}).join('')}</tr>`;}).join('');$('#main').innerHTML=`<div class="intro"><div><div class="eyebrow">Collection analysis</div><h1>Patterns across façades.</h1><p class="muted">Explore saved observations, including profiles in progress.</p></div><button id="returnEntry">← Back to survey</button></div><div class="stat-grid"><div class="stat"><span class="eyebrow">Photographs</span><strong>${photos.length}</strong></div><div class="stat"><span class="eyebrow">Completed</span><strong>${done.length}</strong></div><div class="stat"><span class="eyebrow">Types described</span><strong>${types.filter(t=>t.kind).length}</strong></div></div><div class="insight-grid"><section class="insight-card"><h2>Façade type × greenery</h2><p class="hint">Counts of façade types. Multiple greenery selections can contribute to multiple columns.</p><table><thead><tr><th>Façade type</th>${extraFields[1][2].map(g=>`<th>${g}</th>`).join('')}</tr></thead><tbody>${matrix}</tbody></table></section><section class="insight-card"><h2>Geographic overview</h2><p class="hint">Offline coordinate plot (no basemap). Select a point to open its profile.</p><div id="mapPlot"></div></section><section class="insight-card"><h2>Compare profiles</h2><p class="hint">First façade type per photograph. Values normalized to 0–1; unknown or missing axes are omitted. Axes: window ratio, relief, threshold enclosure, surrounding greenery.</p><select id="compareA" aria-label="First comparison photograph">${list.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select><select id="compareB" aria-label="Second comparison photograph">${list.map((p,i)=>`<option value="${esc(p.id)}" ${i===1?'selected':''}>${esc(p.name)}</option>`).join('')}</select><div id="radar"></div></section><section class="insight-card"><h2>Filter & group</h2><p class="hint">Group by façade type, or select a greenery attribute to narrow the list.</p><select id="kindFilter" aria-label="Filter façade type"><option value="">All façade types</option>${kinds.map(k=>`<option>${k}</option>`).join('')}</select><select id="greenFilter" aria-label="Filter greenery"><option value="">All greenery</option>${extraFields[1][2].map(k=>`<option>${k}</option>`).join('')}</select><div id="clusters"></div></section></div>`;renderMap(photos);renderClusters();mountAnalysisCharts();}
function renderClusters(){const k=$('#kindFilter').value,g=$('#greenFilter').value,groups={};for(const p of photos){for(const t of records[p.id]?.types||[]){if(!t.kind||k&&t.kind!==k||g&&!t.green?.includes(g))continue;(groups[t.kind]??=new Set()).add(p.id);}}$('#clusters').innerHTML=Object.entries(groups).map(([kind,ids])=>`<h3>${esc(kind)} <span class="muted">(${ids.size})</span></h3>${[...ids].map(id=>`<button data-photo="${esc(id)}" style="margin:3px">${esc(photos.find(p=>p.id===id).name)}</button>`).join('')}`).join('')||'<p class="empty">No matching observations.</p>';}
function renderMap(list){const points=list.filter(p=>{const l=locationFor(p);return l.lat!==undefined&&l.lng!==undefined&&l.lat!==''&&l.lng!==''&&Number.isFinite(+l.lat)&&Number.isFinite(+l.lng)&&Math.abs(+l.lat)<=90&&Math.abs(+l.lng)<=180;});if(!points.length){$('#mapPlot').innerHTML='<p class="empty">Add latitude and longitude in the Location step to place photographs here.</p>';return;}const xs=points.map(p=>+locationFor(p).lng),ys=points.map(p=>+locationFor(p).lat),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);$('#mapPlot').innerHTML=`<svg viewBox="0 0 460 290" role="img" aria-label="Photograph coordinate plot"><rect x="40" y="20" width="380" height="220" fill="#ffffff" stroke="#00000026"/><text x="40" y="265" font-size="10">Longitude ${x0.toFixed(4)} → ${x1.toFixed(4)}</text><text x="40" y="14" font-size="10">Latitude ${y0.toFixed(4)} → ${y1.toFixed(4)}</text>${points.map((p,i)=>`<a href="#" data-photo="${esc(p.id)}" aria-label="Open ${esc(p.name)}"><circle cx="${x1===x0?230:60+340*(xs[i]-x0)/(x1-x0)}" cy="${y1===y0?130:220-180*(ys[i]-y0)/(y1-y0)}" r="7" fill="#002FA7" stroke="white" stroke-width="2"><title>${esc(p.name)}</title></circle></a>`).join('')}</svg>`;}
function renderRadar(){renderCustomRadar();}
document.addEventListener('click',async e=>{const el=e.target.closest('button,a[data-photo]');if(!el)return;if(el.dataset.photo){e.preventDefault();current=el.dataset.photo;step=0;typeIndex=0;view='entry';render();}else if(el.dataset.step!==undefined){step=+el.dataset.step;typeIndex=0;render();}else if(el.dataset.type!==undefined){typeIndex=+el.dataset.type;render();}else if(el.id==='back'){if(step===3&&typeIndex>0)typeIndex--;else step--;render();}else if(el.id==='next'){const r=rec(),m=missing(r,step,step===3?typeIndex:null);if(m.length){$('#validation').textContent='Please answer: '+m.join('; ')+'.';return;}if(step===4){r.completed=true;r.updatedAt=new Date().toISOString();await persist();const idx=photos.findIndex(p=>p.id===current),next=[...photos.slice(idx+1),...photos.slice(0,idx)].find(p=>!records[p.id]?.completed);if(next){current=next.id;step=0;typeIndex=0;}else{view='insights';}}else if(step===3&&typeIndex<r.types.length-1)typeIndex++;else step++;render();}else if(el.id==='insights'){view='insights';render();}else if(el.id==='returnEntry'){view='entry';render();}else if(el.id==='saveHtml')await saveHtml();else if(el.id==='exportAnswers')download(JSON.stringify(payload(),null,2),'SHIFT-answers-'+new Date().toISOString().slice(0,10)+'.json','application/json');else if(el.id==='mergeButton')$('#mergeFile').click();else if(el.id==='conflictButton')showConflicts();else if(el.hasAttribute('data-close'))$('#mergeDialog').close();else if(el.dataset.resolve){const c=conflicts.shift();if(el.dataset.resolve==='incoming')records[c.id]=c.incoming;persist();render();showConflicts();}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='search'){renderList();return;}if(el.dataset.location){rec().location[el.dataset.location]=el.value;if(['lat','lng'].includes(el.dataset.location)){rec().location.source='Manual coordinates';scheduleMapSync();}changed();}if(el.dataset.record){rec()[el.dataset.record]=el.value;changed();}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='statusFilter'){renderList();return;}if(['compareA','compareB'].includes(el.id)){renderRadar();return;}if(['kindFilter','greenFilter'].includes(el.id)){renderClusters();return;}if(el.dataset.scope){const r=rec(),obj=el.dataset.scope==='type'?r.types[typeIndex]:r[el.dataset.scope],k=el.dataset.key;if(el.type==='checkbox'){let vals=new Set(obj[k]||[]);if(el.checked){if(['None','Unknown'].includes(el.value))vals.clear();else{vals.delete('None');vals.delete('Unknown');}vals.add(el.value);}else vals.delete(el.value);obj[k]=[...vals];}else obj[k]=el.value;if(k==='kind'){delete obj.threshold;}if(k==='homogeneity'){r.typeArchive={...(r.typeArchive||{})};r.types.forEach((t,i)=>r.typeArchive[i]=t);const n=el.value==='Homogeneous'?1:Math.max(2,r.previousTypeCount||2);r.types=Array.from({length:n},(_,i)=>r.typeArchive[i]||{});typeIndex=0;}changed();render();}else if(el.id==='typeCount'){const n=+el.value;if(!Number.isInteger(n)||n<2||n>30){el.setCustomValidity('Choose an integer from 2 to 30.');el.reportValidity();return;}el.setCustomValidity('');const r=rec();r.typeArchive={...(r.typeArchive||{})};r.types.forEach((t,i)=>r.typeArchive[i]=t);r.types=Array.from({length:n},(_,i)=>r.typeArchive[i]||{});r.previousTypeCount=n;changed();render();}else if(el.id==='mergeFile'){let added=0,clash=0;try{for(const file of el.files){const text=await file.text();const data=file.name.toLowerCase().endsWith('.html')?JSON.parse(new DOMParser().parseFromString(text,'text/html').querySelector('#collection-data')?.textContent||'null'):JSON.parse(text);const result=mergeData(data);added+=result.added;clash+=result.clash;}await persist();render();alert(`${added} profile(s) imported. ${clash} new conflict(s) need review.`);if(conflicts.length)showConflicts();}catch(error){await persist();render();alert('Import stopped: '+error.message);}el.value='';}});
window.addEventListener('beforeunload',e=>{if(!storageOK&&Object.values(records).some(r=>r.updatedAt)){e.preventDefault();e.returnValue='';}});
async function init(){restoreSaveMeta(embedded.saveMeta);restoreAnalysisSettings(embedded.analysisSettings);try{db=await new Promise((resolve,reject)=>{const request=indexedDB.open('shift-fieldbook',1);request.onupgradeneeded=()=>request.result.createObjectStore('state');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});const saved=await new Promise((resolve,reject)=>{const req=db.transaction('state').objectStore('state').get(embedded.dataset);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});if(saved){const s=JSON.parse(saved);restoreSaveMeta(s.saveMeta);restoreAnalysisSettings(s.analysisSettings);mergeUploadedPhotos(s.uploadedPhotos||[]);for(const [id,r]of Object.entries(s.records||{})){if(!records[id]||(r.updatedAt||'')>(records[id].updatedAt||''))records[id]=r;}for(const c of s.conflicts||[])if(!conflicts.some(x=>x.id===c.id&&canonical(x.incoming)===canonical(c.incoming)))conflicts.push(c);}storageOK=true;report('✓ Browser autosave ready');}catch{report('Storage unavailable — export often',true);}render();}init();
</script>
