<!doctype html><meta charset="utf-8"><title>SegFormer pilot review checks</title><pre id="result">RUNNING</pre><iframe id="review" src="../results/pilot/review.html"></iframe><script>
window.addEventListener('load',()=>{try{const w=document.getElementById('review').contentWindow;const checks=w.eval(`(()=>{const checks=[],ok=(v,label)=>{if(!v)throw Error(label);checks.push(label);};ok(data.results.length===20,'20 real pilot results present');const oldCount=data.results[0].window_pixels;const overlay=$('image').src;$('overlay').checked=false;$('overlay').dispatchEvent(new Event('change'));ok($('image').src!==overlay,'Original/overlay switch works');$('verify').click();ok(data.results[0].verified,'Review marks result verified');$('correction').click();ok(!data.results[0].verified&&data.results[0].status==='needs_correction','Review records correction needed');ok(data.results[0].window_pixels===oldCount,'Review decisions preserve AI pixel counts');$('next').click();ok(index===1,'Review advances to next photo');return checks;})()`);document.getElementById('result').textContent='PASS: '+checks.length+' checks\n'+checks.join('\n');}catch(error){document.getElementById('result').textContent='FAIL: '+error.stack;}});
</script>
