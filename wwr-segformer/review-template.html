<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review SegFormer WWR estimates</title><style>body{font:14px Arial;background:#eae4d7;color:#3a3b3b;margin:24px}header,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header h1{margin-right:auto;font-size:24px}button,select{padding:10px;background:white;border:1px solid #bcbbb6;cursor:pointer}.layout{display:grid;grid-template-columns:230px 1fr;gap:24px;margin-top:24px}nav{max-height:75vh;overflow:auto;display:grid;align-content:start;gap:8px}nav button{text-align:left}main{background:white;padding:20px}#image{display:block;max-width:100%;max-height:55vh;margin:20px auto}.muted{font-size:12px;color:#60646a}#warnings{color:#74393b}@media(max-width:700px){.layout{grid-template-columns:1fr}nav{max-height:180px}}</style><header><h1>Review window / wall estimates</h1><button id="save">Export reviewed JSON</button></header><p>Blue: windows · Grey: wall · Ochre: building proxy. Other classes are excluded. These are visible-pixel estimates.</p><div class="layout"><nav id="list"></nav><main><h2 id="name"></h2><div class="actions"><label><input type="checkbox" id="overlay" checked> Show segmentation overlay</label><strong id="ratio"></strong></div><img id="image" alt="Facade and semantic segmentation overlay"><p id="warnings"></p><div class="actions"><button id="verify">Mark verified</button><button id="correction">Needs correction</button><button id="next">Next image →</button></div><p id="state" role="status"></p><p class="muted">Original AI outputs remain unchanged on disk. Export reviewed JSON to keep your decisions. Local image paths work on this computer.</p></main></div><script>
const data=/*RESULTS*/null;let index=0;const $=id=>document.getElementById(id);
function draw(){const row=data.results[index];$('list').replaceChildren(...data.results.map((r,i)=>{const b=document.createElement('button');b.textContent=(r.verified?'✓ ':r.status==='failed'?'! ':'')+r.filename;b.onclick=()=>{index=i;draw();};return b;}));$('name').textContent=row.filename;$('ratio').textContent=Number.isFinite(row.wwr_percent)?row.wwr_percent.toFixed(2)+'% estimated WWR':'No valid ratio';$('image').src=$('overlay').checked?row.overlay_preview||'':row.original_preview||'';$('warnings').textContent=(row.warnings||[]).join(' ')+(row.error?' '+row.error:'');$('state').textContent=row.verified?'Verified':row.status;$('verify').disabled=!Number.isFinite(row.wwr_percent)||row.status==='failed';}
$('overlay').onchange=draw;$('verify').onclick=()=>{const r=data.results[index];r.verified=true;r.status='verified';r.verified_at=new Date().toISOString();draw();};$('correction').onclick=()=>{const r=data.results[index];r.verified=false;r.status='needs_correction';draw();};$('next').onclick=()=>{index=(index+1)%data.results.length;draw();};$('save').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='wwr-reviewed.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);};if(data?.results?.length)draw();
</script></html>
